{% extends "base.html" %}
{% block content %}

<!-- 9-DOT MENU - Utility ke just niche (Right side, Hero se upar) -->
<div style="display: flex; justify-content: flex-end; margin-right: 20px; margin-top: 10px; margin-bottom: 20px;">
    <div style="position: relative;">
        <!-- 9 Dots Button -->
        <button id="appMenuBtn" style="background: white; border: 1px solid #ddd; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; font-size: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center;">
            ⋮⋮⋮
        </button>

        <!-- Dropdown Menu - HORIZONTAL BUTTONS with IMAGES -->
        <div id="appMenuDropdown" style="display: none; position: absolute; top: 55px; right: 0; background: white; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); padding: 12px; z-index: 10000;">
            
            <!-- HORIZONTAL Buttons - Ek line mein -->
            <div style="display: flex; flex-direction: row; gap: 10px; align-items: center; justify-content: center; flex-wrap: nowrap;">
                
                <!-- PDF Button with Image -->
                <a href="{{ url_for('pdf_tools') }}" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 14px; text-decoration: none; color: #333; border-radius: 10px; transition: all 0.2s; border: 1px solid #e0e0e0; min-width: 70px;">
                    <img src="https://github.com/afnankhan123456/Free-AI-Tools-for-PDF-Image-File-Conversion-No-Signup-/raw/main/logo_pic/menu-logo/pdf-tools.png" alt="PDF Tools" style="width: 32px; height: 32px; object-fit: contain;" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <span style="font-size: 11px; font-weight: 500; display: none;">📄</span>
                    <span style="font-size: 11px; font-weight: 500;">PDF</span>
                </a>
                
                <!-- Image Button with Image -->
                <a href="{{ url_for('image_tools') }}" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 14px; text-decoration: none; color: #333; border-radius: 10px; transition: all 0.2s; border: 1px solid #e0e0e0; min-width: 70px;">
                    <img src="https://github.com/afnankhan123456/Free-AI-Tools-for-PDF-Image-File-Conversion-No-Signup-/raw/main/logo_pic/menu-logo/image-tools%20.png" alt="Image Tools" style="width: 32px; height: 32px; object-fit: contain;" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <span style="font-size: 11px; font-weight: 500; display: none;">🖼️</span>
                    <span style="font-size: 11px; font-weight: 500;">Image</span>
                </a>
                
                <!-- Utility Button with Image (Fixed Link) -->
                <a href="{{ url_for('utility_tools') }}" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 14px; text-decoration: none; color: #333; border-radius: 10px; transition: all 0.2s; border: 1px solid #e0e0e0; min-width: 70px;">
                    <img src="https://github.com/afnankhan123456/Free-AI-Tools-for-PDF-Image-File-Conversion-No-Signup-/raw/main/logo_pic/menu-logo/utillity-tools%20.png" alt="Utility Tools" style="width: 32px; height: 32px; object-fit: contain;" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <span style="font-size: 11px; font-weight: 500; display: none;">🔧</span>
                    <span style="font-size: 11px; font-weight: 500;">Utility</span>
                </a>
                
            </div>
        </div>
    </div>
</div>

<!-- HERO SECTION -->
<section class="hero">
    <div class="hero-content">
        <h1>⚡ Free Online AI Tools</h1>
        <p>Compress, Convert & Edit Instantly</p>
    </div>
</section>

<script>
    const menuBtn = document.getElementById('appMenuBtn');
    const dropdown = document.getElementById('appMenuDropdown');

    menuBtn.addEventListener('click', function(event) {
        event.stopPropagation();
        if (dropdown.style.display === 'none' || dropdown.style.display === '') {
            dropdown.style.display = 'block';
        } else {
            dropdown.style.display = 'none';
        }
    });

    document.addEventListener('click', function(event) {
        if (!menuBtn.contains(event.target) && !dropdown.contains(event.target)) {
            dropdown.style.display = 'none';
        }
    });
</script>

<style>
    #appMenuDropdown a:hover {
        background: #e8f0fe !important;
        transform: translateY(-2px);
        border-color: #1a73e8 !important;
    }
    #appMenuBtn:hover {
        background: #f0f0f0;
        transform: scale(1.05);
    }
    
    /* Mobile - Horizontal hi rahega, images adjust ho jayengi */
    @media (max-width: 768px) {
        #appMenuBtn {
            width: 40px !important;
            height: 40px !important;
            font-size: 16px !important;
        }
        #appMenuDropdown {
            padding: 8px !important;
        }
        #appMenuDropdown > div {
            gap: 6px !important;
        }
        #appMenuDropdown a {
            padding: 6px 10px !important;
            min-width: 55px !important;
        }
        #appMenuDropdown img {
            width: 24px !important;
            height: 24px !important;
        }
        #appMenuDropdown span {
            font-size: 10px !important;
        }
    }
</style>

{% endblock %}
