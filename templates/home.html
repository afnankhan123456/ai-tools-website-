{% extends "base.html" %}
{% block content %}

<!-- 9-DOT MENU - EXACT GOOGLE SIZE -->
<div style="display: flex; justify-content: flex-end; margin-right: 20px; margin-top: 10px; margin-bottom: 20px;">
    <div style="position: relative;">
        <!-- 9 Dots Button - Google Exact Size (4px dot, 3px gap) -->
        <button id="appMenuBtn" style="background: transparent; border: none; cursor: pointer; display: flex; flex-direction: column; gap: 3px; align-items: center; justify-content: center; padding: 8px;">
            <!-- Row 1 -->
            <div style="display: flex; gap: 3px;">
                <span style="width: 4px; height: 4px; background-color: #e0e0e0; border-radius: 50%; display: inline-block;"></span>
                <span style="width: 4px; height: 4px; background-color: #e0e0e0; border-radius: 50%; display: inline-block;"></span>
                <span style="width: 4px; height: 4px; background-color: #e0e0e0; border-radius: 50%; display: inline-block;"></span>
            </div>
            <!-- Row 2 -->
            <div style="display: flex; gap: 3px;">
                <span style="width: 4px; height: 4px; background-color: #e0e0e0; border-radius: 50%; display: inline-block;"></span>
                <span style="width: 4px; height: 4px; background-color: #e0e0e0; border-radius: 50%; display: inline-block;"></span>
                <span style="width: 4px; height: 4px; background-color: #e0e0e0; border-radius: 50%; display: inline-block;"></span>
            </div>
            <!-- Row 3 -->
            <div style="display: flex; gap: 3px;">
                <span style="width: 4px; height: 4px; background-color: #e0e0e0; border-radius: 50%; display: inline-block;"></span>
                <span style="width: 4px; height: 4px; background-color: #e0e0e0; border-radius: 50%; display: inline-block;"></span>
                <span style="width: 4px; height: 4px; background-color: #e0e0e0; border-radius: 50%; display: inline-block;"></span>
            </div>
        </button>

        <!-- Dropdown Menu - White Box -->
        <div id="appMenuDropdown" style="display: none; position: absolute; top: 55px; right: 0; background: white; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); padding: 16px; z-index: 10000;">
            
            <!-- Horizontal Buttons - Sirf Images -->
            <div style="display: flex; flex-direction: row; gap: 15px; align-items: center; justify-content: center; flex-wrap: nowrap;">
                
                <!-- PDF Button -->
                <a href="{{ url_for('pdf_tools') }}" style="display: flex; align-items: center; justify-content: center; padding: 8px; text-decoration: none; border-radius: 12px; transition: all 0.2s; border: 1px solid #e0e0e0; min-width: 70px;">
                    <img src="https://github.com/afnankhan123456/Free-AI-Tools-for-PDF-Image-File-Conversion-No-Signup-/raw/main/logo_pic/menu-logo/pdf-tools%20.png" alt="PDF Tools" style="width: 56px; height: 56px; object-fit: contain;">
                </a>
                
                <!-- Image Button -->
                <a href="{{ url_for('image_tools') }}" style="display: flex; align-items: center; justify-content: center; padding: 8px; text-decoration: none; border-radius: 12px; transition: all 0.2s; border: 1px solid #e0e0e0; min-width: 70px;">
                    <img src="https://github.com/afnankhan123456/Free-AI-Tools-for-PDF-Image-File-Conversion-No-Signup-/raw/main/logo_pic/menu-logo/image-tools%20.png" alt="Image Tools" style="width: 56px; height: 56px; object-fit: contain;">
                </a>
                
                <!-- Utility Button -->
                <a href="{{ url_for('utility_tools') }}" style="display: flex; align-items: center; justify-content: center; padding: 8px; text-decoration: none; border-radius: 12px; transition: all 0.2s; border: 1px solid #e0e0e0; min-width: 70px;">
                    <img src="https://github.com/afnankhan123456/Free-AI-Tools-for-PDF-Image-File-Conversion-No-Signup-/raw/main/logo_pic/menu-logo/utility-tools%20.png" alt="Utility Tools" style="width: 56px; height: 56px; object-fit: contain;">
                </a>
                
            </div>
        </div>
    </div>
</div>

<!-- HERO SECTION -->
<section class="hero">
    <div class="hero-content">
        <h1>⚡ Free Online AI Tools</h1>
        <p>Compress, Convert & Edit Instantly</p>
    </div>
</section>

<script>
    const menuBtn = document.getElementById('appMenuBtn');
    const dropdown = document.getElementById('appMenuDropdown');

    menuBtn.addEventListener('click', function(event) {
        event.stopPropagation();
        if (dropdown.style.display === 'none' || dropdown.style.display === '') {
            dropdown.style.display = 'block';
        } else {
            dropdown.style.display = 'none';
        }
    });

    document.addEventListener('click', function(event) {
        if (!menuBtn.contains(event.target) && !dropdown.contains(event.target)) {
            dropdown.style.display = 'none';
        }
    });
</script>

<style>
    #appMenuDropdown a:hover {
        background: #e8f0fe !important;
        transform: translateY(-2px);
        border-color: #1a73e8 !important;
    }
    
    #appMenuBtn:hover {
        opacity: 0.8;
    }
    
    /* Mobile mein bhi same size */
    @media (max-width: 768px) {
        #appMenuBtn span {
            width: 4px !important;
            height: 4px !important;
        }
        #appMenuDropdown {
            padding: 12px !important;
        }
        #appMenuDropdown > div {
            gap: 10px !important;
        }
        #appMenuDropdown a {
            padding: 6px !important;
            min-width: 60px !important;
        }
        #appMenuDropdown img {
            width: 48px !important;
            height: 48px !important;
        }
    }
</style>

{% endblock %}
