<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PDF to Handwriting</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 2rem; }
    #dropZone { border: 2px dashed #aaa; padding: 2rem; margin: 1rem auto; max-width: 400px; cursor: pointer; }
    #dropZone.dragover { background: #f0f0f0; }
    button { margin: 1rem; padding: 0.5rem 1.5rem; cursor: pointer; }
    #status { margin-top: 1rem; color: #555; }
  </style>
</head>
<body>
  <h2>PDF to Handwriting</h2>
  <div id="dropZone">
    <p>Drop PDF here or click to browse (Max: 5MB)</p>
    <input type="file" id="fileInput" accept=".pdf" hidden>
    <div id="fileName"></div>
  </div>
  <button id="convertBtn" disabled>Convert to Handwriting</button>
  <div id="status"></div>

  <script>
    const MAX_FILE_SIZE = 5 * 1024 * 1024;
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileNameDiv = document.getElementById('fileName');
    const convertBtn = document.getElementById('convertBtn');
    const statusDiv = document.getElementById('status');

    fileInput.addEventListener('change', e => {
      if (e.target.files[0]) handleFile(e.target.files[0]);
    });

    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });
    dropZone.addEventListener('click', () => fileInput.click());

    function handleFile(file) {
      if (file.type !== 'application/pdf') { alert('PDF only!'); return; }
      if (file.size > MAX_FILE_SIZE) { alert('File too large (max 5MB)!'); return; }
      fileNameDiv.textContent = '📎 ' + file.name;
      convertBtn.disabled = false;
      window._file = file;
      statusDiv.textContent = '';
    }

    convertBtn.addEventListener('click', async () => {
      if (!window._file) return;
      convertBtn.disabled = true;
      statusDiv.textContent = 'Converting...';

      const formData = new FormData();
      formData.append('pdf', window._file);

      try {
        const res = await fetch('/convert-handwriting', { method: 'POST', body: formData });
        if (!res.ok) throw new Error('Failed');
        const blob = await res.blob();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'handwritten.pdf';
        a.click();
        statusDiv.textContent = 'Done!';
      } catch (e) {
        statusDiv.textContent = 'Error: ' + e.message;
      }
      convertBtn.disabled = false;
    });
  </script>
</body>
</html>
