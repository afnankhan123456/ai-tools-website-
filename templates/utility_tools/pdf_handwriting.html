<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF to Handwriting</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .container {
            background: white; border-radius: 20px; padding: 2rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1); max-width: 600px; width: 100%; text-align: center;
        }
        h1 { font-size: 2rem; color: #2d3436; margin-bottom: 0.5rem; }
        p { color: #636e72; margin-bottom: 1.5rem; }
        .drop-zone {
            border: 2px dashed #a29bfe; border-radius: 15px; padding: 3rem 2rem;
            background: #f9f9ff; transition: 0.3s; cursor: pointer;
        }
        .drop-zone.dragover { background: #e8e7ff; border-color: #6c5ce7; }
        .drop-zone .icon { font-size: 3rem; color: #a29bfe; margin-bottom: 0.5rem; }
        .file-name { margin-top: 1rem; color: #2d3436; font-weight: 500; }
        button {
            background: #6c5ce7; color: white; border: none; padding: 0.8rem 2.5rem;
            border-radius: 30px; font-size: 1rem; margin-top: 1.5rem; cursor: pointer; transition: 0.3s;
            display: inline-flex; align-items: center; gap: 0.5rem;
        }
        button:disabled { background: #b2bec3; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #5b4cdb; }
        .progress {
            width: 100%; height: 6px; background: #dfe6e9; border-radius: 10px;
            margin: 1.5rem 0 0.5rem; overflow: hidden; display: none;
        }
        .progress-bar { height: 100%; width: 0%; background: #6c5ce7; transition: width 0.3s; }
        .status { margin-top: 0.5rem; color: #2d3436; font-size: 0.9rem; }
        .download-link {
            display: none; margin-top: 1.5rem; color: #0984e3;
            text-decoration: underline; font-weight: 500; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✍️ PDF to Handwriting</h1>
        <p>Upload your assignment PDF and get it in realistic handwriting style.</p>

        <div class="drop-zone" id="dropZone">
            <div class="icon">📄</div>
            <p>Drag & drop your PDF here, or click to select</p>
            <input type="file" id="fileInput" accept=".pdf" hidden>
            <div class="file-name" id="fileName"></div>
        </div>

        <button id="convertBtn" disabled>
            <span>✨</span> Convert to Handwriting
        </button>

        <div class="progress" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="status" id="statusText"></div>
        <a class="download-link" id="downloadLink" download="handwritten_assignment.pdf">⬇️ Download Converted PDF</a>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const convertBtn = document.getElementById('convertBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');
        const downloadLink = document.getElementById('downloadLink');

        let selectedFile = null;

        // Click to open file dialog
        dropZone.addEventListener('click', () => fileInput.click());

        // File selected via browse
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        });

        // Drag & drop events
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        });

        function handleFile(file) {
            if (file.type !== 'application/pdf') {
                alert('Please upload a PDF file only!');
                return;
            }
            selectedFile = file;
            fileName.textContent = '📎 ' + file.name;
            convertBtn.disabled = false;
            // Reset UI
            progressContainer.style.display = 'none';
            statusText.textContent = '';
            downloadLink.style.display = 'none';
        }

        // Convert button click
        convertBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            const formData = new FormData();
            formData.append('pdf', selectedFile);

            convertBtn.disabled = true;
            progressContainer.style.display = 'block';
            progressBar.style.width = '0%';
            statusText.textContent = 'Uploading & converting...';

            try {
                const response = await fetch('/convert-handwriting', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const err = await response.json().catch(() => ({ error: 'Conversion failed' }));
                    throw new Error(err.error || 'Conversion failed');
                }

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                downloadLink.href = url;
                downloadLink.style.display = 'block';
                statusText.textContent = 'Conversion complete!';
                progressBar.style.width = '100%';
                convertBtn.disabled = false;
            } catch (error) {
                statusText.textContent = 'Error: ' + error.message;
                convertBtn.disabled = false;
                progressContainer.style.display = 'none';
            }
        });
    </script>
</body>
</html>
